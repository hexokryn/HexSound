name: Native C++ builds
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new Windows release after checks (never overwrite)
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    paths: ['native/**', 'CMakeLists.txt', 'scripts/**', '.github/workflows/release.yml']
permissions:
  contents: read
env:
  QT_VERSION: '6.12.1'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt and WebEngine from official repositories
        run: python scripts/install-qt.py --output "$env:RUNNER_TEMP/Qt"
      - name: Build and test
        run: ./scripts/build-native.ps1 -QtRoot "$env:RUNNER_TEMP/Qt/$env:QT_VERSION/msvc2022_64" -BuildDir build -Test -Deploy
      - name: Verify deployed folder without Qt in PATH
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '(?i)[/\\]Qt[/\\]' }) -join ';'
          $app = Start-Process -WindowStyle Hidden -FilePath "$PWD/release/HexSound-native/HexSound.exe" -ArgumentList '--smoke','artifacts/native-windows-packaged' -PassThru -RedirectStandardOutput 'packaged-out.log' -RedirectStandardError 'packaged-error.log'
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw 'Smoke timeout' }
          Get-Content packaged-error.log
          if ($app.ExitCode -ne 0) { throw "Smoke failed: $($app.ExitCode)" }
      - name: Build setup and portable, verify update replacement and rollback
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $env:PATH = "${env:ProgramFiles(x86)}/NSIS;$env:PATH"
          ./scripts/package-native.ps1
          ./scripts/test-update.ps1 -BuildDir build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-Windows
          retention-days: 7
          path: |
            artifacts/native-*/*.png
            artifacts/native-*/report.json
            artifacts/native-*/qt.log
            .tools/*-result.txt
            release/*native-portable.zip
            release/*setup.exe
            release/*-SHA256SUMS.txt
      - name: Publish a new Windows release
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) || (github.event_name == 'workflow_dispatch' && inputs.publish))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'project\(HexSound VERSION ([0-9.]+)').Groups[1].Value
          if (!$version) { throw 'Missing version' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite" }
          $assets = @("release/HexSound-$version-setup.exe", "release/HexSound-$version-native-portable.zip", "release/HexSound-$version-SHA256SUMS.txt")
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing $asset" } }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HexSound $version" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb patchelf dpkg-dev p7zip-full libnss3 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxss1 libasound2t64 libegl1-mesa-dev libxcb-cursor0 libopengl0 libxdamage1 libgl1-mesa-dri
          python scripts/install-qt.py --output "$RUNNER_TEMP/Qt"
      - name: Build, test and package Linux
        run: |
          export PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
          xvfb-run -a ./build/HexSound --smoke artifacts/native-linux
          cmake --install build --prefix "$PWD/release/linux"
          xvfb-run -a ./release/linux/bin/HexSound --smoke artifacts/native-linux-packaged
          cpack --config build/CPackConfig.cmake -G DEB
          tar -C release -czf release/HexSound-0.13.0-linux-x64.tar.gz linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-Linux
          retention-days: 7
          path: |
            artifacts/native-*/*.png
            artifacts/native-*/report.json
            artifacts/native-*/qt.log
            release/*.tar.gz
            ./*.deb
