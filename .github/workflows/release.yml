name: Build and publish Windows and Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Canonical-path tests use native realpath on Windows and Linux.
      - name: Test
        run: npm test
      - name: Verify GitHub update redirects in Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/check-update-transport.cjs
      - name: Verify GitHub update redirects in Electron (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "require('electron')"
          $application = Start-Process -WindowStyle Hidden -FilePath 'node_modules/electron/dist/electron.exe' -ArgumentList 'scripts/check-update-transport.cjs' -Wait -PassThru -RedirectStandardOutput 'update-transport.log' -RedirectStandardError 'update-transport-error.log'
          Get-Content update-transport.log
          Get-Content update-transport-error.log
          exit $application.ExitCode
      - name: Verify native Linux interface
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --library-test
      - name: Verify library radio and audio engine
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --experience-test
      - name: Verify lazy startup and record process memory
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --memory-test --memory-label=linux
      # Settings subpages keep the active tab visible on small windows.
      # Includes the persistent bottom player alongside library navigation.
      - name: Verify unified interface and update prompt
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --unified-test
      - name: Upload interface audit
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interface-audit
          if-no-files-found: ignore
          path: artifacts/hexsound-unified/*.png
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist -- --publish never
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $application = Start-Process -FilePath 'release/win-unpacked/HexSound.exe' -ArgumentList '--experience-test' -Wait -PassThru -RedirectStandardOutput 'experience.log' -RedirectStandardError 'experience-error.log'
          Get-Content experience.log
          Get-Content experience-error.log
          exit $application.ExitCode
      - name: Build Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never
      - name: Verify packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a ./release/linux-unpacked/hexsound --experience-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexsound-${{ runner.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hexsound-*
          merge-multiple: true
          path: release
      - name: Publish checked builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then echo 'Tag and package version differ'; exit 1; fi
          (cd release && sha256sum *.exe *.AppImage *.deb *.tar.gz > SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/hexsound-draft; then
            if [[ "$(cat /tmp/hexsound-draft)" == false ]]; then echo 'Already published; keeping existing assets.'; exit 0; fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "HexSound $version" --notes-file "docs/release-$tag.md"
          fi
          gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
