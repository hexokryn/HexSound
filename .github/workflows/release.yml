name: Publish Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build Setup and Portable
        run: npm run dist -- --publish never
      - name: Prepare release assets
        shell: pwsh
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$taskVersion") { throw 'Tag and package version differ' }
          Copy-Item -LiteralPath docs/media/HexSound-telegram.mp4 -Destination release/HexSound-telegram.mp4
          Copy-Item -LiteralPath media/post.ru.txt -Destination release/post.ru.txt
          $taskFiles = @("HexSound-$taskVersion-setup.exe", "HexSound-$taskVersion-portable.exe", 'HexSound-telegram.mp4', 'post.ru.txt')
          $taskHashes = foreach ($taskFile in $taskFiles) {
            $taskHash = Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release $taskFile)
            $taskHash.Hash.ToLowerInvariant() + '  ' + $taskFile
          }
          $taskHashes | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $taskTag = "v$taskVersion"
          $taskExisting = gh release view $taskTag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($taskExisting | ConvertFrom-Json).isDraft) { Write-Output 'This version is already published; keeping its assets.'; exit 0 }
          } else {
            gh release create $taskTag --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "HexSound $taskVersion" --notes-file "docs/release-$taskTag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft' }
          }
          $taskAssets = @("release/HexSound-$taskVersion-setup.exe", "release/HexSound-$taskVersion-portable.exe", 'release/HexSound-telegram.mp4', 'release/post.ru.txt', 'release/SHA256SUMS.txt')
          gh release upload $taskTag @taskAssets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $taskTag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release' }
